<!-- ============================================================ -->
<!-- POPUP: FOTO LOGO (dipakai bersama untuk Stiker & Resin)      -->
<!-- ============================================================ -->
<div id="popup-logo-photo"
    class="app-popup hidden fixed inset-0 z-[100] items-end sm:items-center justify-center bg-black/40">
    <div class="app-overlay-panel bg-white w-full sm:max-w-sm sm:rounded-lg rounded-t-lg h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between px-4 py-3 border-b border-ink-faint">
            <div id="logo_photo_popup_title" class="font-bold text-ink-primary">Logo</div>
            <button class="popup-close text-ink-secondary text-xl leading-none">&times;</button>
        </div>
        <div class="p-4 space-y-3">
            <div id="logo_photo_current_wrap" class="hidden text-center">
                <img id="logo_photo_current"
                    class="max-w-full max-h-48 object-contain rounded-md border border-ink-faint mx-auto" />
            </div>

            <label id="logo_photo_zone" for="logo_photo_input" class="mat-import-dropzone">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-ink-faint mb-1.5" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                    <circle cx="12" cy="13" r="4" />
                </svg>
                <span class="text-xs font-semibold text-ink-secondary">Tap untuk ambil / ganti foto</span>
            </label>
            <input type="file" id="logo_photo_input" accept="image/*" capture="environment" class="hidden">
            <div id="logo_photo_new_preview_wrap" class="hidden">
                <img id="logo_photo_new_preview"
                    class="w-full max-h-40 object-contain rounded-md border border-ink-faint" />
            </div>

            <button id="btn-logo-photo-save" class="btn-action btn-action--primary">SIMPAN</button>
        </div>
    </div>
</div>


<!-- ============================================================ -->
<!-- POPUP: PREVIEW FOTO (read-only, dipakai dari popup History -- -->
<!-- cuma lihat, tanpa dropzone/tombol simpan)                    -->
<!-- ============================================================ -->
<div id="popup-logo-photo-view"
    class="app-popup hidden fixed inset-0 z-[110] items-end sm:items-center justify-center bg-black/40">
    <div class="app-overlay-panel bg-white w-full sm:max-w-sm sm:rounded-lg rounded-t-lg max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between px-4 py-3 border-b border-ink-faint sticky top-0 bg-white">
            <div id="logo_photo_view_title" class="font-bold text-ink-primary">Logo</div>
            <button class="popup-close text-ink-secondary text-xl leading-none">&times;</button>
        </div>
        <div class="p-4 text-center">
            <img id="logo_photo_view_img" class="max-w-full max-h-[65vh] object-contain rounded-md border border-ink-faint mx-auto" />
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- POPUP: HISTORY (SPK yang stiker & resin-nya sudah lengkap)   -->
<!-- ============================================================ -->
<div id="popup-logo-history"
    class="app-popup hidden fixed inset-0 z-[100] items-end sm:items-center justify-center bg-black/40">
    <div class="app-overlay-panel bg-white w-full sm:max-w-lg sm:rounded-lg rounded-t-lg h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between px-4 py-3 border-b border-ink-faint sticky top-0 bg-white">
            <div>
                <div class="font-bold text-ink-primary">History Logo</div>
                <div class="text-xs text-ink-secondary">Total: <span id="jumlah_history_logo">0</span></div>
            </div>
            <button class="popup-close text-ink-secondary text-xl leading-none">&times;</button>
        </div>
        <div class="p-3 pb-0">
            <div class="search-input-wrap">
                <input id="filter_history_logo" type="text" placeholder="Cari Perusahaan / Type / SPK"
                    class="search-input">
                <svg class="search-icon w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.3-4.3" />
                </svg>
            </div>
        </div>
        <div class="p-3">
            <div class="tbl-wrap">
                <table class="tbl-dark tbl-bordered">
                    <thead>
                        <tr>
                            <th class="td-left">SPK</th>
                            <th class="td-left">Perusahaan</th>
                            <th class="td-left">Type</th>
                            <th class="td-center" colspan="2">Logo</th>
                        </tr>
                    </thead>
                    <tbody id="data_history_logo">
                        <tr>
                            <td colspan="5" class="tbl-empty">Belum ada history</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- PAGE CONTENT                                                 -->
<!-- ============================================================ -->
<div class="p-3 pb-0">
    <div class="card-surface p-3.5">
        <div class="flex items-center gap-2.5 mb-2.5 flex-wrap">
            <div class="flex items-center gap-1.5 flex-1 min-w-0">
                <span class="section-title">Data</span>
                <span class="fs-14 text-ink-faint">|</span>
                <span id="logo_count" class="section-count">0</span>
            </div>
            <button id="btn-logo-history" title="Riwayat" class="icon-btn icon-btn--danger">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <polyline points="12 6 12 12 16 14" />
                </svg>
            </button>
            <button id="btn-logo-refresh" title="Refresh" class="icon-btn icon-btn--primary">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M21 2v6h-6" />
                    <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
                    <path d="M3 22v-6h6" />
                    <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
                </svg>
            </button>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-2.5">
            <input id="perusahaan_logo_filter" type="text" placeholder="Cari Perusahaan" class="mat-input h-9 text-sm">
            <input id="type_logo_filter" type="text" placeholder="Cari Type" class="mat-input h-9 text-sm">
        </div>
        <select id="bantuan_logo_filter" class="mat-input h-9 text-sm">
            <option value="">Semua Data</option>
            <option value="Surabaya">Surabaya</option>
            <option value="Jakarta">Jakarta</option>
            <option value="Palembang">Palembang</option>
        </select>
    </div>
</div>

<div class="p-3">
    <div class="card-surface overflow-hidden">
        <div class="tbl-wrap">
            <table class="tbl-dark tbl-bordered" style="min-width:700px;">
                <thead>
                    <tr>
                        <th class="td-center" style="width:6%;">No</th>
                        <th class="td-center">Deadline</th>
                        <th class="td-left">SPK</th>
                        <th class="td-left">Customer</th>
                        <th class="td-left">Type</th>
                        <th class="td-center">Jml</th>
                        <th class="td-left">Bantuan</th>
                        <th class="td-center" colspan="2">Logo</th>
                    </tr>
                </thead>
                <tbody id="logo_value">
                    <tr>
                        <td colspan="8" class="tbl-empty">Memuat data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div id="tombol_paginasi_logo" class="p-2"></div>
    </div>
</div>
