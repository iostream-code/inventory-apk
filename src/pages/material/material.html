<!-- ============================================================ -->
<!-- POPUP: TAMBAH / EDIT MATERIAL                                -->
<!-- ============================================================ -->
<div id="popup-material-form"
    class="app-popup hidden fixed inset-0 z-[100] items-end sm:items-center justify-center bg-black/40">
    <div class="app-overlay-panel bg-white w-full sm:max-w-md sm:rounded-lg rounded-t-lg h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between px-4 py-3 border-b border-ink-faint sticky top-0 bg-white">
            <div class="font-bold text-ink-primary">Master | Material</div>
            <button class="popup-close text-ink-secondary text-xl leading-none">&times;</button>
        </div>

        <div class="p-4 space-y-3.5">
            <div id="mat_form_code_wrap" class="hidden">
                <label class="mat-label">KODE MATERIAL</label>
                <input id="mat_form_code_display" type="text" class="mat-input opacity-80" readonly
                    style="color:var(--text-muted);font-weight:700;">
            </div>
            <input type="hidden" id="mat_form_id" value="">

            <div>
                <label class="mat-label">NAMA MATERIAL <span class="text-red-500">*</span></label>
                <input id="mat_form_name" type="text" class="mat-input" placeholder="Nama lengkap material">
            </div>

            <div id="mat_form_barcode_wrap" class="hidden">
                <label class="mat-label">BARCODE</label>
                <input id="mat_form_barcode_display" type="text" class="mat-input" readonly>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="mat-label">KATEGORI</label>
                    <select id="mat_form_category" class="mat-input">
                        <option value="">— Tanpa Kategori —</option>
                    </select>
                </div>
                <div>
                    <label class="mat-label">SATUAN <span class="text-red-500">*</span></label>
                    <select id="mat_form_unit" class="mat-input"></select>
                </div>
            </div>

            <div>
                <label class="mat-label">LOKASI RAK</label>
                <input id="mat_form_rack_location" type="text" class="mat-input" placeholder="Contoh: A1-03">
            </div>

            <div>
                <label class="mat-label">TIPE MATERIAL</label>
                <label id="mat_form_stockable_label"
                    class="flex items-center gap-3 cursor-pointer p-3 bg-white border-[1px] border-green-200 rounded-md transition-colors">
                    <input type="checkbox" id="mat_form_is_stockable" checked
                        class="w-[18px] h-[18px] accent-green-600 flex-shrink-0 cursor-pointer">
                    <div>
                        <div id="mat_form_stockable_title" class="text-[13px] font-bold text-green-700">Dapat Di-Stock
                        </div>
                        <div class="text-[11px] text-ink-muted mt-0.5">Hilangkan centang jika material ini PO by SPK
                            (tidak butuh stok min/max)</div>
                    </div>
                </label>
            </div>

            <div id="mat_form_minmax_section" class="grid grid-cols-2 gap-3">
                <div>
                    <label class="mat-label">MIN. STOK</label>
                    <input id="mat_form_min_stock" type="number" class="mat-input" placeholder="0" value="0">
                </div>
                <div>
                    <label class="mat-label">MAX. STOK</label>
                    <input id="mat_form_max_stock" type="number" class="mat-input" placeholder="0" value="0">
                </div>
            </div>

            <div>
                <label class="mat-label">FOTO</label>
                <label id="mat_form_photo_zone" for="mat_form_photo_input" class="mat-import-dropzone">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-ink-faint mb-1.5" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 16l4.586-4.586a2 2 0 0 1 2.828 0L16 16" />
                        <path d="M14 14l1.586-1.586a2 2 0 0 1 2.828 0L20 14" />
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <circle cx="8" cy="8" r="1.5" />
                    </svg>
                    <span class="text-xs font-semibold text-ink-secondary">Tap untuk pilih foto</span>
                </label>
                <input type="file" id="mat_form_photo_input" accept="image/*" class="hidden">
                <div id="mat_form_photo_preview_wrap" class="hidden relative mt-2">
                    <img id="mat_form_photo_preview"
                        class="w-full max-h-40 object-contain rounded-md border border-ink-faint" />
                    <button type="button" id="btn-mat-photo-clear"
                        class="absolute top-1.5 right-1.5 bg-black/60 text-white rounded-full w-6 h-6 text-sm">&times;</button>
                </div>
            </div>

            <button id="mat_form_btn" class="btn-action btn-action--primary">SIMPAN</button>
        </div>
    </div>
</div>


<!-- ============================================================ -->
<!-- PAGE CONTENT                                                 -->
<!-- ============================================================ -->
<div id="material-page-content">
    <div class="p-3 pb-0">
        <div class="card-surface p-3.5">
            <div class="flex items-center gap-2.5 mb-2.5 flex-wrap">
                <div class="flex items-center gap-1.5 flex-1 min-w-0">
                    <span class="section-title">Data</span>
                    <span class="fs-14 text-ink-faint">|</span>
                    <span id="mat_total_count" class="section-count">0</span>
                </div>

                <button id="btn-mat-refresh" title="Refresh" class="icon-btn icon-btn--primary">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M21 2v6h-6" />
                        <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
                        <path d="M3 22v-6h6" />
                        <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
                    </svg>
                </button>
                <button id="btn-mat-barcode" title="Cetak Barcode (pilih material dulu via checkbox)"
                    class="icon-btn icon-btn--warning">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <rect x="3" y="5" width="2" height="14" />
                        <rect x="7" y="5" width="1" height="14" />
                        <rect x="10" y="5" width="2" height="14" />
                        <rect x="14" y="5" width="1" height="14" />
                        <rect x="17" y="5" width="2" height="14" />
                        <rect x="20" y="5" width="1" height="14" />
                    </svg>
                </button>
                <button id="btn-mat-add" title="Tambah Material" class="icon-btn icon-btn--primary">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                </button>
            </div>

            <div class="flex items-center gap-2">
                <div class="search-input-wrap flex-1">
                    <input id="mat_search" type="text" placeholder="Cari material..." class="search-input">
                    <svg class="search-icon w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.3-4.3" />
                    </svg>
                </div>
                <select id="mat_filter_status"
                    class="text-sm font-semibold border border-ink-faint rounded-md py-2 px-2.5 bg-surface-base flex-shrink-0">
                    <option value="all">Semua</option>
                    <option value="ok">Aman</option>
                    <option value="low">Menipis</option>
                    <option value="empty">Habis</option>
                    <option value="overstock">Overstock</option>
                </select>
            </div>
        </div>
    </div>

    <div class="p-3">
        <div class="card-surface overflow-hidden">
            <div class="tbl-wrap">
                <table class="tbl-dark tbl-bordered" style="min-width:560px;">
                    <thead>
                        <tr>
                            <th class="td-center" style="width:6%;">
                                <input type="checkbox" id="mat_select_all" title="Pilih semua (utk Cetak Barcode)"
                                    class="w-4 h-4 accent-green-600 cursor-pointer">
                            </th>
                            <th class="td-center" style="width:5%;">NO</th>
                            <th class="td-left">KODE</th>
                            <th class="td-left">NAMA MATERIAL</th>
                            <th class="td-center" style="width:8%;">MIN</th>
                            <th class="td-center" style="width:10%;">STOK</th>
                            <th class="td-center" style="width:12%;">STATUS</th>
                            <th class="td-center" style="width:14%;">OPSI</th>
                        </tr>
                    </thead>
                    <tbody id="mat_table">
                        <tr>
                            <td colspan="8" class="tbl-empty">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
