<div class="login-screen-content">
  <div class="lsc-grid"></div>
  <div class="lsc-orb lsc-orb-1"></div>
  <div class="lsc-orb lsc-orb-2"></div>
  <div class="lsc-orb lsc-orb-3"></div>

  <div class="lsc-body">

    <div class="lsc-hero">
      <div class="lsc-icon-wrap">
        <img src="img/logo/logo_koperindo_hitam.png" alt="Koperindo" />
      </div>
      <h1 class="lsc-title">Inventory</h1>
      <div class="lsc-subtitle">"Sebuah tim bukan sekelompok orang yang bekerja bersama. Tim adalah sekelompok orang
        yang saling percaya."</div>
    </div>

    <div class="lsc-card">
      <div class="lsc-card-strip"></div>
      <div class="lsc-card-inner">

        <div class="lsc-field">
          <div class="lsc-field-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            <span>Username</span>
          </div>
          <input type="text" id="username" name="username" placeholder="Masukan Username" autocomplete="username" />
        </div>

        <div class="lsc-divider"></div>

        <div class="lsc-field">
          <div class="lsc-field-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <span>Kata Sandi</span>
          </div>
          <div class="lsc-input-wrap">
            <input type="password" id="password" name="password" placeholder="Masukan Kata Sandi"
              autocomplete="current-password" />
            <button type="button" id="toggle-password" tabindex="-1" aria-label="Tampilkan kata sandi"
              class="lsc-eye-btn">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

      </div>
    </div>

    <div class="lsc-btn-wrap">
      <a class="lsc-btn" id="btn-login">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
          <polyline points="10 17 15 12 10 7" />
          <line x1="15" y1="12" x2="3" y2="12" />
        </svg>
        Masuk
      </a>
    </div>

    <div class="lsc-footer">
      <p>ITAI KOPERINDO &copy; 2026</p>
    </div>

  </div>
</div>
