<!-- ============================================================ -->
<!-- POPUP: KELUARKAN BARANG                                      -->
<!-- ============================================================ -->
<div id="popup-stockout-out"
    class="app-popup hidden fixed inset-0 z-[100] items-end sm:items-center justify-center bg-black/40">
    <div class="app-overlay-panel bg-white w-full sm:max-w-lg sm:rounded-lg rounded-t-lg h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between px-4 py-3 border-b border-ink-faint sticky top-0 bg-white">
            <div>
                <div class="font-bold text-ink-primary">KELUARKAN BARANG</div>
                <div class="text-xs text-ink-secondary"><span id="so_out_req_number">-</span> — <span
                        id="so_out_req_date">-</span></div>
            </div>
            <button class="popup-close text-ink-secondary text-xl leading-none">&times;</button>
        </div>

        <div class="p-3">
            <div class="tbl-wrap mb-3">
                <table class="tbl-dark tbl-bordered">
                    <thead>
                        <tr>
                            <th class="td-left">MATERIAL</th>
                            <th class="td-center">SISA</th>
                            <th class="td-center">STOK</th>
                            <th class="td-center">KELUAR</th>
                        </tr>
                    </thead>
                    <tbody id="so_out_items">
                        <tr>
                            <td colspan="4" class="tbl-empty">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="mb-3">
                <label class="mat-label">FOTO BUKTI <span class="text-red-500">*</span></label>
                <label id="so_out_photo_zone" for="so_out_photo_input" class="mat-import-dropzone">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-ink-faint mb-1.5" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                        <circle cx="12" cy="13" r="4" />
                    </svg>
                    <span class="text-xs font-semibold text-ink-secondary">Tap untuk ambil / pilih foto</span>
                </label>
                <input type="file" id="so_out_photo_input" accept="image/*" capture="environment" class="hidden">
                <div id="so_out_photo_preview_wrap" class="hidden relative mt-2">
                    <img id="so_out_photo_preview"
                        class="w-full max-h-40 object-contain rounded-md border border-ink-faint" />
                    <button type="button" id="so_out_photo_clear"
                        class="absolute top-1.5 right-1.5 bg-black/60 text-white rounded-full w-6 h-6 text-sm">&times;</button>
                </div>
            </div>

            <button id="so_out_btn_submit" class="btn-action btn-action--primary">SIMPAN PENGELUARAN</button>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- POPUP: DETAIL REQUEST (read-only)                            -->
<!-- ============================================================ -->
<div id="popup-stockout-detail"
    class="app-popup hidden fixed inset-0 z-[100] items-end sm:items-center justify-center bg-black/40">
    <div class="app-overlay-panel bg-white w-full sm:max-w-lg sm:rounded-lg rounded-t-lg h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between px-4 py-3 border-b border-ink-faint sticky top-0 bg-white">
            <div>
                <div id="so_det_req_number" class="font-bold text-ink-primary">-</div>
                <div class="text-xs text-ink-secondary"><span id="so_det_req_date">-</span></div>
            </div>
            <button class="popup-close text-ink-secondary text-xl leading-none">&times;</button>
        </div>
        <div class="p-3">
            <div class="flex items-center gap-2 mb-3">
                <div class="flex-1 h-2 rounded-full bg-surface-raised overflow-hidden">
                    <div id="so_det_progress_bar" class="h-full"
                        style="width:0%;background:var(--color-primary-light);"></div>
                </div>
                <span id="so_det_progress_pct" class="text-xs font-bold">0%</span>
            </div>
            <div class="tbl-wrap mb-3">
                <table class="tbl-dark tbl-bordered">
                    <thead>
                        <tr>
                            <th class="td-left">MATERIAL</th>
                            <th class="td-center">DIMINTA</th>
                            <th class="td-center">KELUAR</th>
                            <th class="td-center">SISA</th>
                        </tr>
                    </thead>
                    <tbody id="so_det_items">
                        <tr>
                            <td colspan="4" class="tbl-empty">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <button id="so_det_btn_out" class="btn-action btn-action--primary">KELUARKAN</button>
        </div>
    </div>
</div>


<!-- ============================================================ -->
<!-- PAGE CONTENT                                                 -->
<!-- ============================================================ -->
<div class="p-3 pb-0">
    <div class="card-surface p-3.5">
        <div class="flex items-center gap-2.5 mb-2.5 flex-wrap">
            <div class="flex items-center gap-1.5 flex-1 min-w-0">
                <span class="section-title">Data</span>
                <span class="fs-11 text-ink-faint">|</span>
                <span id="so_active_count" class="section-count">0</span>
            </div>
            <select id="so_filter_status"
                class="text-sm font-semibold border border-ink-faint rounded-md py-1.5 px-2 bg-surface-base">
                <option value="all">Semua</option>
                <option value="PENDING">Belum Dikeluarkan</option>
                <option value="PARTIAL">Sebagian</option>
            </select>
            <button id="btn-so-refresh" title="Refresh" class="icon-btn">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M21 2v6h-6" />
                    <path d="M3 12a9 9 0 0 1 15-6.7L21 8" />
                    <path d="M3 22v-6h6" />
                    <path d="M21 12a9 9 0 0 1-15 6.7L3 16" />
                </svg>
            </button>
        </div>

        <div class="flex gap-2 mb-2.5">
            <select id="so_filter_month" class="mat-input h-9 text-sm flex-1"></select>
            <select id="so_filter_year" class="mat-input h-9 text-sm flex-1"></select>
        </div>

        <div class="search-input-wrap">
            <input id="so_search" type="text" placeholder="Cari No. Request..." class="search-input">
            <svg class="search-icon w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
            </svg>
        </div>
    </div>
</div>

<div class="p-3">
    <div class="card-surface overflow-hidden">
        <div class="tbl-wrap">
            <table class="tbl-dark tbl-bordered">
                <thead>
                    <tr>
                        <th class="td-center" style="width:6%;">NO</th>
                        <th class="td-left">NO. REQUEST</th>
                        <th class="td-center">TGL</th>
                        <th class="td-center">STATUS</th>
                        <th class="td-center">AKSI</th>
                    </tr>
                </thead>
                <tbody id="so_req_table">
                    <tr>
                        <td colspan="5" class="tbl-empty">Memuat data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
